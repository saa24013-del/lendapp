<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学校備品 貸出管理システム (lendapp)</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      margin-bottom: 24px;
    }
    .hidden { display: none !important; }
    
    /* ログイン画面 (認証ガード) */
    #login-screen {
      text-align: center;
      padding: 60px 20px;
    }
    #login-screen h1 { margin-top: 0; color: #0f172a; }
    #login-screen p { color: #64748b; margin-bottom: 24px; }
    
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-danger { background-color: #ef4444; }
    .btn-danger:hover { background-color: #dc2626; }
    .btn-success { background-color: #10b981; }
    .btn-success:hover { background-color: #059669; }
    
    /* フォーム設定 */
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* 検索 & フィルター（発展機能） */
    .filter-box {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
    }

    /* 一覧テーブル */
    .table-container { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { background-color: #f1f5f9; font-weight: 600; }
    .status-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
    }
    .status-borrowed { background: #fee2e2; color: #991b1b; }
    .status-returned { background: #d1fae5; color: #065f46; }
    
    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
      .filter-box { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. ログイン制限画面 (Google認証ガード) -->
    <div id="login-screen" class="card">
      <h1>📦 学校備品 貸出管理アプリ</h1>
      <p>ご利用にはGoogleアカウントでのログインが必要です。</p>
      <button id="google-login-btn" class="btn">🔑 Googleアカウントでログイン</button>
    </div>

    <!-- 2. ログイン完了後にのみ表示されるメインアプリ画面 -->
    <div id="app-screen" class="hidden">
      
      <!-- ユーザーヘッダー -->
      <div class="header card">
        <div>
          ログイン中: <strong id="user-display-name"></strong>
        </div>
        <button id="logout-btn" class="btn btn-danger">ログアウト</button>
      </div>

      <!-- 5項目 入力フォーム -->
      <div class="card">
        <h2>📝 貸出記録の新規登録</h2>
        <form id="lend-form">
          <div class="grid-2">
            <!-- ① 備品名 -->
            <div class="form-group">
              <label for="item-name">① 備品名 (工具・機材など)</label>
              <input type="text" id="item-name" placeholder="例: インパクトドライバー A" required>
            </div>
            <!-- ② カテゴリ -->
            <div class="form-group">
              <label for="category">② カテゴリ</label>
              <select id="category" required>
                <option value="">選択してください</option>
                <option value="電動工具">電動工具</option>
                <option value="手工具">手工具</option>
                <option value="測定機器">測定機器</option>
                <option value="PC・撮影機材">PC・撮影機材</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>

          <!-- ③ 借用者名 -->
          <div class="form-group">
            <label for="borrower-name">③ 借用者氏名</label>
            <input type="text" id="borrower-name" placeholder="例: 山田 太郎" required>
          </div>

          <div class="grid-2">
            <!-- ④ 貸出日 -->
            <div class="form-group">
              <label for="borrow-date">④ 貸出日</label>
              <input type="date" id="borrow-date" required>
            </div>
            <!-- ⑤ 返却予定日 -->
            <div class="form-group">
              <label for="return-date">⑤ 返却予定日</label>
              <input type="date" id="return-date" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 8px;">登録する</button>
        </form>
      </div>

      <!-- データ一覧表示 -->
      <div class="card">
        <h2>📋 貸出・返却一覧</h2>
        
        <!-- 【発展機能】リアルタイム検索 & カテゴリフィルター -->
        <div class="filter-box">
          <input type="text" id="search-input" placeholder="備品名や借用者名で検索...">
          <select id="filter-category" style="max-width: 200px;">
            <option value="ALL">すべてのカテゴリ</option>
            <option value="電動工具">電動工具</option>
            <option value="手工具">手工具</option>
            <option value="測定機器">測定機器</option>
            <option value="PC・撮影機材">PC・撮影機材</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>備品名</th>
                <th>カテゴリ</th>
                <th>借用者</th>
                <th>貸出日</th>
                <th>返却予定日</th>
                <th>状態 / 操作</th>
              </tr>
            </thead>
            <tbody id="records-table-body">
              <!-- Firestoreから自動描画されます -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <!-- Firebase JavaScript SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase設定（ご指定の情報）
    const firebaseConfig = {
      apiKey: "AIzaSyClJgqoTxtEUEHnJKW7JNgUUbkGlJTmmj0",
      authDomain: "lendapp-602f9.firebaseapp.com",
      projectId: "lendapp-602f9",
      storageBucket: "lendapp-602f9.firebasestorage.app",
      messagingSenderId: "76338008537",
      appId: "1:76338008537:web:e4001badcc84d7c17649c8"
    };

    // 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById("login-screen");
    const appScreen = document.getElementById("app-screen");
    const userDisplayName = document.getElementById("user-display-name");
    
    let allRecords = [];

    // 今日の日付を貸出日の初期値に設定
    document.getElementById("borrow-date").valueAsDate = new Date();

    // --------------------------------------------------
    // 1. Google 認証 & 画面アクセス制限ガード
    // --------------------------------------------------
    document.getElementById("google-login-btn").addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        alert("ログインエラー: " + error.message);
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      signOut(auth);
    });

    // ログイン状態の変化を監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // ログイン時：メイン画面を表示し、データを同期
        loginScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");
        userDisplayName.textContent = user.displayName || user.email;
        loadFirestoreRecords();
      } else {
        // 未ログイン時：ログイン制限画面を表示
        appScreen.classList.add("hidden");
        loginScreen.classList.remove("hidden");
      }
    });

    // --------------------------------------------------
    // 2. 5項目の登録機能 (Firestore永続保存)
    // --------------------------------------------------
    document.getElementById("lend-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const recordData = {
        itemName: document.getElementById("item-name").value,
        category: document.getElementById("category").value,
        borrowerName: document.getElementById("borrower-name").value,
        borrowDate: document.getElementById("borrow-date").value,
        returnDate: document.getElementById("return-date").value,
        status: "貸出中",
        createdAt: serverTimestamp(),
        createdByUid: auth.currentUser.uid
      };

      try {
        await addDoc(collection(db, "lend_records"), recordData);
        alert("貸出記録を登録しました！");
        document.getElementById("lend-form").reset();
        document.getElementById("borrow-date").valueAsDate = new Date();
      } catch (err) {
        console.error("保存失敗:", err);
        alert("保存に失敗しました: " + err.message);
      }
    });

    // --------------------------------------------------
    // 3. 一覧表示 (Firestoreリアルタイム取得)
    // --------------------------------------------------
    function loadFirestoreRecords() {
      const q = query(collection(db, "lend_records"), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        allRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTable(allRecords);
      });
    }

    function renderTable(records) {
      const tbody = document.getElementById("records-table-body");
      tbody.innerHTML = "";

      const searchKeyword = document.getElementById("search-input").value.toLowerCase();
      const selectedCategory = document.getElementById("filter-category").value;

      const filtered = records.filter(r => {
        const matchesSearch = (r.itemName || "").toLowerCase().includes(searchKeyword) || 
                              (r.borrowerName || "").toLowerCase().includes(searchKeyword);
        const matchesCategory = selectedCategory === "ALL" || r.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">データがありません</td></tr>`;
        return;
      }

      filtered.forEach((r) => {
        const tr = document.createElement("tr");
        const isBorrowed = r.status === "貸出中";

        tr.innerHTML = `
          <td><strong>${escapeHtml(r.itemName)}</strong></td>
          <td>${escapeHtml(r.category)}</td>
          <td>${escapeHtml(r.borrowerName)}</td>
          <td>${r.borrowDate || ''}</td>
          <td>${r.returnDate || ''}</td>
          <td>
            <span class="status-badge ${isBorrowed ? 'status-borrowed' : 'status-returned'}">
              ${r.status || '貸出中'}
            </span>
            ${isBorrowed 
              ? `<button class="btn btn-success" style="padding: 2px 8px; font-size: 0.8rem; margin-left: 6px;" onclick="window.toggleStatus('${r.id}', '返却済')">返却</button>`
              : `<button class="btn" style="padding: 2px 8px; font-size: 0.8rem; margin-left: 6px; background:#64748b;" onclick="window.toggleStatus('${r.id}', '貸出中')">再貸出</button>`
            }
            <button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.8rem; margin-left: 4px;" onclick="window.deleteRecord('${r.id}')">削除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 発展機能：ワンクリック返却トグル
    window.toggleStatus = async (id, newStatus) => {
      await updateDoc(doc(db, "lend_records", id), { status: newStatus });
    };

    // 発展機能：レコード削除
    window.deleteRecord = async (id) => {
      if (confirm("この記録を削除しますか？")) {
        await deleteDoc(doc(db, "lend_records", id));
      }
    };

    // 検索・絞り込みフィルターイベント
    document.getElementById("search-input").addEventListener("input", () => renderTable(allRecords));
    document.getElementById("filter-category").addEventListener("change", () => renderTable(allRecords));

    function escapeHtml(str) {
      if (!str)
