<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学校備品 貸出管理システム (lendapp)</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }
    .hidden { display: none !important; }
    
    #login-screen {
      text-align: center;
      padding: 40px 20px;
    }
    
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-danger { background-color: #ef4444; }
    .btn-success { background-color: #10b981; }
    .btn-secondary { background-color: #64748b; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .filter-box { margin-bottom: 16px; display: flex; gap: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background-color: #f1f5f9; }
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .status-borrowed { background: #fee2e2; color: #991b1b; }
    .status-returned { background: #d1fae5; color: #065f46; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .fallback-box { margin-top: 30px; padding-top: 20px; border-top: 1px dashed var(--border); }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. ログイン画面 -->
    <div id="login-screen" class="card">
      <h1>📦 学校備品 貸出管理アプリ</h1>
      <p>ご利用にはログインが必要です。</p>
      
      <button id="google-login-btn" class="btn" style="font-size:1.1rem; padding: 12px 24px;">🔑 Googleアカウントでログイン</button>

      <!-- サードパーティCookieやポップアップが制限されている場合のフォールバック機能 -->
      <div class="fallback-box">
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">Googleログインが開かない・動作しない場合はこちら：</p>
        <div style="display: flex; gap: 8px; max-width: 350px; margin: 0 auto;">
          <input type="text" id="demo-name-input" placeholder="お名前を入力 (例: 山田太郎)">
          <button id="demo-login-btn" class="btn btn-secondary" style="white-space: nowrap;">簡易ログイン</button>
        </div>
      </div>
    </div>

    <!-- 2. メインアプリ画面 -->
    <div id="app-screen" class="hidden">
      
      <div class="header card">
        <div>
          ログイン中: <strong id="user-display-name"></strong>
        </div>
        <button id="logout-btn" class="btn btn-danger">ログアウト</button>
      </div>

      <!-- 5項目 入力フォーム -->
      <div class="card">
        <h2>📝 貸出記録の新規登録</h2>
        <form id="lend-form">
          <div class="grid-2">
            <div class="form-group">
              <label for="item-name">① 備品名 (工具・機材など)</label>
              <input type="text" id="item-name" placeholder="例: インパクトドライバー A" required>
            </div>
            <div class="form-group">
              <label for="category">② カテゴリ</label>
              <select id="category" required>
                <option value="">選択してください</option>
                <option value="電動工具">電動工具</option>
                <option value="手工具">手工具</option>
                <option value="測定機器">測定機器</option>
                <option value="PC・撮影機材">PC・撮影機材</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="borrower-name">③ 借用者氏名</label>
            <input type="text" id="borrower-name" placeholder="例: 山田 太郎" required>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label for="borrow-date">④ 貸出日</label>
              <input type="date" id="borrow-date" required>
            </div>
            <div class="form-group">
              <label for="return-date">⑤ 返却予定日</label>
              <input type="date" id="return-date" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 8px;">登録する</button>
        </form>
      </div>

      <!-- データ一覧表示 -->
      <div class="card">
        <h2>📋 貸出・返却一覧</h2>
        
        <div class="filter-box">
          <input type="text" id="search-input" placeholder="備品名や借用者名で検索...">
          <select id="filter-category" style="max-width: 200px;">
            <option value="ALL">すべてのカテゴリ</option>
            <option value="電動工具">電動工具</option>
            <option value="手工具">手工具</option>
            <option value="測定機器">測定機器</option>
            <option value="PC・撮影機材">PC・撮影機材</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>備品名</th>
                <th>カテゴリ</th>
                <th>借用者</th>
                <th>貸出日</th>
                <th>返却予定日</th>
                <th>状態 / 操作</th>
              </tr>
            </thead>
            <tbody id="records-table-body">
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClJgqoTxtEUEHnJKW7JNgUUbkGlJTmmj0",
      authDomain: "lendapp-602f9.firebaseapp.com",
      projectId: "lendapp-602f9",
      storageBucket: "lendapp-602f9.firebasestorage.app",
      messagingSenderId: "76338008537",
      appId: "1:76338008537:web:e4001badcc84d7c17649c8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById("login-screen");
    const appScreen = document.getElementById("app-screen");
    const userDisplayName = document.getElementById("user-display-name");
    
    let allRecords = [];
    let activeUser = null;

    document.getElementById("borrow-date").valueAsDate = new Date();

    // 1. Google 認証 (ポップアップ試行 ➔ ダメならリダイレクト)
    document.getElementById("google-login-btn").addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.warn("Popup blocked/failed, trying redirect...", error);
        try {
          await signInWithRedirect(auth, provider);
        } catch (err) {
          alert("ログイン処理エラー: " + err.message);
        }
      }
    });

    // 簡易ログイン（ローカルフォールバック）
    document.getElementById("demo-login-btn").addEventListener("click", () => {
      const name = document.getElementById("demo-name-input").value.trim();
      if (!name) return alert("お名前を入力してください");
      
      activeUser = { displayName: name, uid: "local-" + Date.now() };
      localStorage.setItem("lendapp_user", JSON.stringify(activeUser));
      showAppScreen(activeUser);
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("lendapp_user");
      signOut(auth).then(() => location.reload());
    });

    // ログイン監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        activeUser = user;
        showAppScreen(user);
      } else {
        const savedUser = localStorage.getItem("lendapp_user");
        if (savedUser) {
          activeUser = JSON.parse(savedUser);
          showAppScreen(activeUser);
        } else {
          appScreen.classList.add("hidden");
          loginScreen.classList.remove("hidden");
        }
      }
    });

    function showAppScreen(user) {
      loginScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");
      userDisplayName.textContent = user.displayName || user.email || "ユーザー";
      if (!document.getElementById("borrower-name").value) {
        document.getElementById("borrower-name").value = user.displayName || "";
      }
      loadFirestoreRecords();
    }

    // 2. 5項目の登録機能
    document.getElementById("lend-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const recordData = {
        itemName: document.getElementById("item-name").value,
        category: document.getElementById("category").value,
        borrowerName: document.getElementById("borrower-name").value,
        borrowDate: document.getElementById("borrow-date").value,
        returnDate: document.getElementById("return-date").value,
        status: "貸出中",
        createdAt: serverTimestamp(),
        createdByUid: activeUser ? activeUser.uid : "unknown"
      };

      try {
        await addDoc(collection(db, "lend_records"), recordData);
        alert("貸出記録を登録しました！");
        document.getElementById("lend-form").reset();
        document.getElementById("borrow-date").valueAsDate = new Date();
        if (activeUser && activeUser.displayName) {
          document.getElementById("borrower-name").value = activeUser.displayName;
        }
      } catch (err) {
        console.error("保存失敗:", err);
        alert("保存に失敗しました: " + err.message);
      }
    });

    // 3. 一覧表示 (Firestore)
    function loadFirestoreRecords() {
      const q = query(collection(db, "lend_records"), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        allRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTable(allRecords);
      }, (error) => {
        console.error("データ取得エラー:", error);
      });
    }

    function renderTable(records) {
      const tbody = document.getElementById("records-table-body");
      tbody.innerHTML = "";

      const searchKeyword = document.getElementById("search-input").value.toLowerCase();
      const selectedCategory = document.getElementById("filter-category").value;

      const filtered = records.filter(r => {
        const matchesSearch = (r.itemName || "").toLowerCase().includes(searchKeyword) || 
                              (r.borrowerName || "").toLowerCase().includes(searchKeyword);
        const matchesCategory = selectedCategory === "ALL" || r.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">データがありません</td></tr>`;
        return;
      }

      filtered.forEach((r) => {
        const tr = document.createElement("tr");
        const isBorrowed = r.status === "貸出中";

        tr.innerHTML = `
          <td><strong>${escapeHtml(r.itemName)}</strong></td>
          <td>${escapeHtml(r.category)}</td>
          <td>${escapeHtml(r.borrowerName)}</td>
          <td>${r.borrowDate || ''}</td>
          <td>${r.returnDate || ''}</td>
          <td>
            <span class="status-badge ${isBorrowed ? 'status-borrowed' : 'status-returned'}">
              ${r.status || '貸出中'}
            </span>
            ${isBorrowed 
              ? `<button class="btn btn-success" style="padding: 2px 8px; font-size: 0.8rem; margin-left: 6px;" onclick="window.toggleStatus('${r.id}', '返却済')">返却</button>`
              : `<button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.8rem; margin-left: 6px;" onclick="window.toggleStatus('${r.id}', '貸出中')">再貸出</button>`
            }
            <button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.8rem; margin-left: 4px;" onclick="window.deleteRecord('${r.id}')">削除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.toggleStatus = async (id, newStatus) => {
      await updateDoc(doc(db, "lend_records", id), { status: newStatus });
    };

    window.deleteRecord = async (id) => {
      if (confirm("この記録を削除しますか？")) {
        await deleteDoc(doc(db, "lend_records", id));
      }
    };

    document.getElementById("search-input").addEventListener("input", () => renderTable(allRecords));
    document.getElementById("filter-category").addEventListener("change", () => renderTable(allRecords));

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }
  </script>
</body>
</html>
